plugins {
	id 'fabric-loom' version '1.17-SNAPSHOT'
	id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

repositories {
	maven { url "https://maven.terraformersmc.com/releases/" } // Mod Menu
	exclusiveContent {
		forRepository {
			maven {
				name = "Modrinth"
				url = "https://api.modrinth.com/maven"
			}
		}
		filter {
			includeGroup "maven.modrinth"
		}
	}
}

loom {
	// Minecraft 26.2 is distributed unobfuscated; accept Mojang's mapping license.
	silentMojangMappingsLicense()
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings loom.officialMojangMappings()
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

	// Mod Menu integration (BloomModMenuIntegration.java depends on this)
	modImplementation "com.terraformersmc:modmenu:${project.modmenu_version}"

	// Sodium internals are referenced by SodiumVulkanTerrainUniforms (Vulkan terrain pass hook).
	// compileOnly + not bundled: Sodium is an optional runtime dependency, guarded at runtime
	// by ShineRenderBackend.isVulkan() / Sodium-presence checks.
	modCompileOnly "maven.modrinth:AANobbMI:${project.sodium_version}"
}

java {
	// Minecraft 26.2 compiles against Java 25.
	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
	withSourcesJar()
}

processResources {
	inputs.property "version", project.version
	filesMatching("fabric.mod.json") {
		expand "version": project.version
	}
}

tasks.withType(JavaCompile).configureEach {
	options.release = 25
}

jar {
	from("LICENSE") {
		rename { "${it}_${project.archivesBaseName}" }
	}
}
