plugins {
	id "net.fabricmc.fabric-loom" version "1.17-SNAPSHOT"
	id "maven-publish"
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

repositories {
	maven { url "https://maven.terraformersmc.com/releases/" } // Mod Menu
	exclusiveContent {
		forRepository {
			maven {
				name = "Modrinth"
				url = "https://api.modrinth.com/maven"
			}
		}
		filter {
			includeGroup "maven.modrinth"
		}
	}
}

dependencies {
	// Minecraft 26.2 ships unobfuscated (Mojang's own names) - no mappings dependency,
	// and no remapping step, so all mod dependencies below use plain (not "mod"-prefixed) configurations.
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

	// Mod Menu integration (BloomModMenuIntegration.java depends on this)
	implementation "com.terraformersmc:modmenu:${project.modmenu_version}"

	// Sodium internals are referenced by SodiumVulkanTerrainUniforms (Vulkan terrain pass hook).
	// compileOnly + not bundled: Sodium is an optional runtime dependency, guarded at runtime
	// by ShineRenderBackend.isVulkan() / Sodium-presence checks.
	compileOnly "maven.modrinth:AANobbMI:${project.sodium_version}"
}

java {
	// Minecraft 26.2 compiles against Java 25.
	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
	withSourcesJar()
}

processResources {
	inputs.property "version", project.version
	filesMatching("fabric.mod.json") {
		expand "version": project.version
	}
}

tasks.withType(JavaCompile).configureEach {
	options.release = 25
}

jar {
	from("LICENSE") {
		rename { "${it}_${project.archivesBaseName}" }
	}
}
